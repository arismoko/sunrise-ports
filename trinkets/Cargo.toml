[package]
name = "mod-trinkets"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "Trinkets for Sunrise: the player's extra equipment slots, in a menu on G"
# Ported from: Trinkets 3.7.2 (Emi, C4, MIT).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
# Trinkets for Sunrise: native code in src/, the slot placeholder items in data/, pictures and text in assets/.
